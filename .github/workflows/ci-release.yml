name: CI & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install build and test tools
        run: python -m pip install --upgrade pip pytest build

      - name: Run Python unit tests
        run: python -m pytest

      - name: Run JavaScript unit tests
        run: node --test tests/jpy_currency_fix_test.mjs

      - name: Verify tag matches pyproject.toml version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python - <<'EOF'
          import os
          import sys
          import tomllib

          tag_version = os.environ['GITHUB_REF_NAME'].removeprefix('v')
          with open('pyproject.toml', 'rb') as f:
              pkg_version = tomllib.load(f)['project']['version']

          if tag_version != pkg_version:
              print(
                  f'Tag version ({tag_version}) does not match pyproject.toml version ({pkg_version})',
                  file=sys.stderr,
              )
              sys.exit(1)
          print(f'Verified tag v{tag_version} matches pyproject.toml')
          EOF

      - name: Build sdist and wheel
        run: python -m build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  release:
    needs: test-and-build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
