[project]
name = 'indico-plugin-jpy-currency-fix'
description = 'Hide trailing .00 decimals for JPY (and configurable zero-decimal currencies) in Indico registration forms, payment transaction details, and registration stats.'
readme = 'README.md'
version = '0.1.0'
license = 'MIT'
classifiers = [
    'Environment :: Plugins',
    'Environment :: Web Environment',
    'License :: OSI Approved :: MIT License',
    'Programming Language :: Python :: 3.12',
]
requires-python = '>=3.12.2, <3.13'
dependencies = ['indico>=3.3.0']

[project.entry-points.'indico.plugins']
jpy_currency_fix = 'indico_jpy_currency_fix.plugin:JPYCurrencyFixPlugin'

[build-system]
requires = ['hatchling>=1.21.0']
build-backend = 'hatchling.build'

[tool.hatch.build]
packages = ['indico_jpy_currency_fix']
exclude = [
    'tests/',
    '*_test.py',
    'conftest.py',
    'pytest.ini',
]
